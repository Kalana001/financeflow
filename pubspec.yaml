name: financeflow
description: A secure personal finance tracking mobile application built in Flutter.
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Local Storage
  fl_chart: ^0.66.0
  provider: ^6.1.1
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
