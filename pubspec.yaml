name: financeflow
description: A secure personal finance tracking mobile application built in Flutter with Supabase backend.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Integration (Auth, Database, Storage)
  supabase_flutter: ^2.5.0

  # Push Notifications & Firebase Services
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # UI & Chart Icons
  fl_chart: ^0.66.0
  provider: ^6.1.1
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Keeps architecture modular to import assets / icons later
    - assets/
