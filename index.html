<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FinanceFlow - Offline Personal Finance Tracker Web Simulator">
  <title>FinanceFlow - Interactive Mobile App Simulator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-alpha: rgba(37, 99, 235, 0.15);
      --success: #10b981;
      --success-alpha: rgba(16, 185, 129, 0.1);
      --danger: #ef4444;
      --danger-alpha: rgba(239, 68, 68, 0.1);
      --warning: #f59e0b;
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --radius-md: 18px;
      --radius-lg: 28px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    [data-theme='dark'] {
      --bg-app: #090d16;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #374151;
    }

    [data-color-preset='emerald'] { --primary: #10b981; --primary-hover: #059669; }
    [data-color-preset='violet'] { --primary: #8b5cf6; --primary-hover: #7c3aed; }
    [data-color-preset='sunset'] { --primary: #f97316; --primary-hover: #ea580c; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .simulator-wrapper {
      display: flex;
      gap: 30px;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }

    .info-pane { flex: 1; display: none; }
    @media (min-width: 768px) { .info-pane { display: block; } }

    .info-pane h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #3b82f6;
      margin-bottom: 12px;
    }

    .info-pane p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .feature-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .phone-simulator {
      width: 390px;
      height: 780px;
      background-color: var(--bg-app);
      border-radius: 44px;
      border: 10px solid #2e354f;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--text-primary);
    }

    .phone-simulator::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 22px;
      background-color: #2e354f;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 1000;
    }

    .status-bar {
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 24px 6px;
      font-size: 12px;
      font-weight: 700;
      z-index: 99;
    }

    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 80px;
      scrollbar-width: none;
    }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background-color: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 10px;
      z-index: 90;
    }

    [data-theme='dark'] .bottom-nav { background-color: rgba(17,24,39,0.8); }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary); }

    .card {
      background-color: var(--bg-surface);
      border-radius: var(--radius-md);
      padding: 18px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .card-gradient {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--bg-surface-elevated); color: var(--text-primary); outline: none; }
  </style>
</head>
<body>

<div class="simulator-wrapper">
  <div class="info-pane">
    <div class="feature-badge">🔒 100% Offline & Private</div>
    <h1>FinanceFlow Local Simulator</h1>
    <p>Zero cloud accounts or email logins required. Set up your Profile Name and PIN code to start tracking your finances privately on your device.</p>
  </div>

  <div class="phone-simulator" id="phoneBody">
    <div class="status-bar">
      <span id="timeDisplay">14:38</span>
      <span>📶 🔋 98%</span>
    </div>
    <div class="app-container" id="appBody"></div>
  </div>
</div>

<script>
  const DB_KEY = 'financeflow_offline_sim';
  
  let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
    profile: null,
    transactions: [
      { id: 'tx-1', amount: 2500, type: 'expense', category: 'Food', date: '2026-07-28', notes: 'Pizza Hut family dinner', location: 'Colombo' },
      { id: 'tx-2', amount: 150000, type: 'income', category: 'Salary', date: '2026-07-27', notes: 'Paycheck salary', location: 'Office' }
    ]
  };

  const saveDb = () => localStorage.setItem(DB_KEY, JSON.stringify(db));

  let activeTab = 'home';
  let pinUnlocked = false;
  let enteredPin = '';

  const appBody = document.getElementById('appBody');

  const updateClock = () => {
    const now = new Date();
    document.getElementById('timeDisplay').innerText = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  };
  setInterval(updateClock, 1000);
  updateClock();

  const render = () => {
    if (db.profile) {
      document.documentElement.setAttribute('data-color-preset', db.profile.theme || 'classic-blue');
      document.documentElement.setAttribute('data-theme', db.profile.isDarkMode ? 'dark' : 'light');
    }

    if (!db.profile) {
      renderSetupScreen();
      return;
    }

    if (!pinUnlocked) {
      renderPinLockScreen();
      return;
    }

    let content = '';
    if (activeTab === 'home') content = renderHomeView();
    else if (activeTab === 'transactions') content = renderTransactionsView();
    else if (activeTab === 'settings') content = renderSettingsView();

    appBody.innerHTML = `
      <div class="screen-content">${content}</div>
      <nav class="bottom-nav">
        <div class="nav-item ${activeTab === 'home' ? 'active' : ''}" onclick="activeTab='home'; render();"><span>🏠</span><span>Home</span></div>
        <div class="nav-item ${activeTab === 'transactions' ? 'active' : ''}" onclick="activeTab='transactions'; render();"><span>📝</span><span>History</span></div>
        <div class="nav-item ${activeTab === 'settings' ? 'active' : ''}" onclick="activeTab='settings'; render();"><span>⚙️</span><span>Settings</span></div>
      </nav>
    `;
  };

  const renderSetupScreen = () => {
    appBody.innerHTML = `
      <div class="screen-content" style="display:flex; flex-direction:column; justify-content:center; height:100%;">
        <div style="text-align:center; margin-bottom:24px;">
          <h2 style="font-family:'Outfit'; font-size:28px; font-weight:800; color:var(--primary);">Welcome to FinanceFlow</h2>
          <span style="font-size:12px; color:var(--text-secondary);">Set up your Profile & PIN to get started</span>
        </div>
        <form onsubmit="handleSetup(event)" class="card">
          <div class="form-group">
            <label class="form-label">Profile Name</label>
            <input type="text" class="form-input" id="setupName" placeholder="e.g. Alex" required />
          </div>
          <div class="form-group">
            <label class="form-label">4-Digit Security PIN</label>
            <input type="password" class="form-input" id="setupPin" maxLength="4" placeholder="e.g. 1234" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create Profile</button>
        </form>
      </div>
    `;
  };

  const handleSetup = (e) => {
    e.preventDefault();
    const name = document.getElementById('setupName').value;
    const pin = document.getElementById('setupPin').value;
    db.profile = { name, pin, currency: 'LKR', isDarkMode: false, theme: 'classic-blue' };
    saveDb();
    pinUnlocked = true;
    render();
  };

  const renderPinLockScreen = () => {
    let dots = [0,1,2,3].map(i => `<span style="width:12px; height:12px; border-radius:50%; border:2px solid var(--border-color); display:inline-block; margin: 0 6px; background-color:${enteredPin.length > i ? 'var(--primary)' : 'transparent'};"></span>`).join('');

    appBody.innerHTML = `
      <div class="screen-content" style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%;">
        <div style="text-align:center; margin-bottom:20px;">
          <span style="font-size:36px;">🔒</span>
          <h3 style="font-family:'Outfit'; font-weight:800; font-size:18px;">Welcome Back, ${db.profile.name}!</h3>
          <p style="font-size:11px; color:var(--text-muted);">Enter PIN to unlock</p>
        </div>
        <div style="margin-bottom:30px;">${dots}</div>
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:220px;">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="btn btn-outline" style="border-radius:50%; width:54px; height:54px; font-weight:700; font-size:18px;" onclick="pressPin('${n}')">${n}</button>`).join('')}
          <button class="btn btn-outline" style="border-radius:50%; width:54px; height:54px; font-size:11px;" onclick="enteredPin=''; render();">Clear</button>
          <button class="btn btn-outline" style="border-radius:50%; width:54px; height:54px; font-weight:700; font-size:18px;" onclick="pressPin('0')">0</button>
          <button class="btn btn-outline" style="border-radius:50%; width:54px; height:54px; font-size:16px;" onclick="pinUnlocked=true; render();">☝️</button>
        </div>
      </div>
    `;
  };

  window.pressPin = (d) => {
    if (enteredPin.length >= 4) return;
    enteredPin += d;
    render();
    if (enteredPin === db.profile.pin) {
      pinUnlocked = true;
      render();
    } else if (enteredPin.length === 4) {
      alert('Invalid PIN!');
      enteredPin = '';
      render();
    }
  };

  const renderHomeView = () => {
    const inc = db.transactions.filter(t => t.type==='income').reduce((s,t) => s+t.amount,0);
    const exp = db.transactions.filter(t => t.type==='expense').reduce((s,t) => s+t.amount,0);
    const bal = inc - exp;

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <div>
          <h3 style="font-family:'Outfit'; font-weight:800; font-size:18px;">Hello, ${db.profile.name}! 👋</h3>
          <span style="font-size:11px; color:var(--text-secondary);">Your local private wealth dashboard.</span>
        </div>
        <button class="btn btn-outline" onclick="pinUnlocked=false; enteredPin=''; render();" style="padding:6px 12px; font-size:11px;">Lock</button>
      </div>

      <div class="card card-gradient">
        <span style="font-size:11px; text-transform:uppercase; font-weight:700;">Total Balance</span>
        <h1 style="font-family:'Outfit'; font-size:30px; font-weight:800; margin: 4px 0 12px;">${db.profile.currency} ${bal.toLocaleString()}</h1>
        <div style="display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.2); padding-top:10px; font-size:12px;">
          <span>🟢 Income: ${inc.toLocaleString()}</span>
          <span>🔴 Expense: ${exp.toLocaleString()}</span>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-secondary);">Recent Activity</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${db.transactions.map(tx => `
          <div class="card" style="padding:12px; margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:13px; font-weight:700;">${tx.notes || tx.category}</div>
              <span style="font-size:10px; color:var(--text-muted);">${tx.date} • ${tx.location || 'Colombo'}</span>
            </div>
            <span style="font-weight:800; font-size:13px; color:${tx.type==='expense'?'var(--danger)':'var(--success)'}">
              ${tx.type==='expense'?'-':'+'} ${tx.amount}
            </span>
          </div>
        `).join('')}
      </div>
    `;
  };

  const renderTransactionsView = () => {
    return `
      <h3 style="font-family:'Outfit'; font-weight:800; font-size:18px; margin-bottom:15px;">Add Transaction</h3>
      <form onsubmit="handleAddTx(event)" class="card">
        <div class="form-group">
          <label class="form-label">Amount</label>
          <input type="number" id="txAmount" class="form-input" placeholder="LKR 0.00" required />
        </div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select id="txType" class="form-input">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="txCategory" class="form-input">
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Salary">💰 Salary</option>
            <option value="Bills">⚡ Bills</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <input type="text" id="txNotes" class="form-input" placeholder="e.g. Lunch" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Save Transaction</button>
      </form>
    `;
  };

  const handleAddTx = (e) => {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('txAmount').value);
    const category = document.getElementById('txCategory').value;
    const type = document.getElementById('txType').value;
    const notes = document.getElementById('txNotes').value;

    db.transactions.unshift({
      id: 'tx-' + Date.now(),
      amount, category, type, notes, date: new Date().toISOString().split('T')[0]
    });
    saveDb();
    activeTab = 'home';
    render();
  };

  const renderSettingsView = () => {
    return `
      <h3 style="font-family:'Outfit'; font-weight:800; font-size:18px; margin-bottom:15px;">Profile Settings</h3>
      <div class="card">
        <span class="form-label">Data Controls</span>
        <button class="btn btn-outline" onclick="alert(JSON.stringify(db, null, 2))" style="width:100%; margin-bottom:10px;">Export JSON Data</button>
        <button class="btn btn-primary" onclick="localStorage.removeItem(DB_KEY); db={profile:null, transactions:[]}; pinUnlocked=false; render();" style="width:100%; background-color:var(--danger);">Reset Profile & Clear Data</button>
      </div>
    `;
  };

  render();
</script>
</body>
</html>
