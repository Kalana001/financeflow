name: Build Android Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # 4. Generate clean native platform wrappers
      - name: Create Native Platforms
        run: flutter create . --overwrite --org com.example

      # 5. Restore custom application code and configs
      - name: Restore Custom Source Files
        run: |
          git checkout android/app/build.gradle || true
          git checkout android/app/upload-keystore.jks || true
          git checkout android/key.properties || true
          git checkout android/app/google-services.json || true
          git checkout android/app/src/main/AndroidManifest.xml || true
          git checkout lib/
          git checkout pubspec.yaml
          git checkout assets/ || true

      # 6. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 7. Build Android Release APK & App Bundle (.aab)
      - name: Build APK and App Bundle
        run: |
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons

      # 8. Upload the built APK as a downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: financeflow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 9. Upload the built App Bundle (.aab) for Google Play Store
      - name: Upload Play Store App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: financeflow-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
