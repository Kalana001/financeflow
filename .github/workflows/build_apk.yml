name: Build Android Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment (Required for Gradle build)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x' # Stable version compatible with sdk limits
          channel: 'stable'
          cache: true

      # 4. Reconstruct native platforms (Generates clean gradlew and properties matching SDK version)
      - name: Reconstruct Native Platforms
        run: |
          flutter create . --overwrite --org com.example

      # 5. Inject Google Services Plugin configuration dynamically (Modern Plugins DSL)
      - name: Configure Firebase Gradle Plugins
        run: |
          # Insert google-services plugin into the top plugins block of app/build.gradle
          sed -i 's/id "dev.flutter.flutter-gradle-plugin"/id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"/g' android/app/build.gradle
          
          # Insert classpath resolution into settings.gradle
          sed -i 's/id "dev.flutter.flutter-plugin-loader" version "1.0.0"/id "dev.flutter.flutter-plugin-loader" version "1.0.0"\n    id "com.google.gms.google-services" version "4.4.1" apply false/g' android/settings.gradle

      # 6. Restore manifest and google-services configuration from Git checkins
      - name: Restore Custom Configs
        run: |
          git checkout android/app/google-services.json
          git checkout android/app/src/main/AndroidManifest.xml

      # 7. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 8. Build Android Release APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload the built APK as a downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: financeflow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
